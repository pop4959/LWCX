# Názvy bloků záměrně ponechány v anglicky a překládá se pouze barva - v českém kulturním prostředí
# Minecraftu nikdo nebude rozumět českým překladům, většina hráčů hraje Minecraft v angličtině.
#
# The names of the blocks are intentionally left in English and only the color is translated. 
# In the Czech cultural environment of Minecraft, no one will understand Czech translations as most players play Minecraft in English.
